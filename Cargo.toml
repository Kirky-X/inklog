[package]
name = "inklog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Enterprise-grade Rust logging infrastructure"

[workspace]
resolver = "2"
members = [".", "examples"]

[workspace.package]
version = "0.3.0-rc.2"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky.X"]
license-file = "LICENSE"
repository = "https://github.com/Kirky-X/inklog"

[workspace.dependencies]
# Shared across workspace crates — all use default-features = false
async-trait = { version = "0.1", default-features = false }
tokio = { version = "1.53", default-features = false, features = ["full"] }
tracing = { version = "0.1", default-features = false }
anyhow = { version = "1.0", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
tempfile = { version = "3.27", default-features = false }
log = { version = "0.4", default-features = false, features = ["std"] }
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
dbnexus = { version = "0.6.0-rc.2", path = "../dbnexus", default-features = false, features = ["sql-parser", "config-env", "macros", "permission", "observability", "retry", "failover", "replica-routing"] }

[package.metadata.docs.rs]
features = ["default", "http", "cli", "compression", "parquet"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(feature, values(\"sqlite\", \"postgres\", \"mysql\", \"duckdb\", \"kit\", \"compression\", \"parquet\", \"fast-masking\"))"] }

[lints]
workspace = true

[features]
default = []
# 测试面 mock 导出（MockCache/MockConfig/MockDatabaseAdapter）的门控 feature：
# 不入 default 与任何生产组合；src 内联测试经 cfg(test) 直接可见，
# 外部测试消费者需显式启用。
test-utils = []
# ⚠️ 数据库后端 features（sqlite/postgres/mysql/duckdb）互斥：dbnexus 严格禁止
# embedded 与 server-side 驱动混合（含 --all-features 全开）。多后端 crate 不适用
# --all-features 验证，按后端分组启用 features 验证。
sqlite = ["dep:dbnexus", "dbnexus/sqlite", "dbnexus/runtime-tokio-rustls"]
postgres = ["dep:dbnexus", "dbnexus/postgres", "dbnexus/runtime-tokio-rustls"]
mysql = ["dep:dbnexus", "dbnexus/mysql", "dbnexus/runtime-tokio-rustls"]
# DuckDB 数据库后端（通过 dbnexus 连接池）
duckdb = ["dep:dbnexus", "dbnexus/duckdb", "dbnexus/runtime-tokio-rustls"]
http = ["dep:axum", "dep:axum-server"]
cli = ["dep:clap", "dep:glob"]
# trait-kit lifecycle/observability integration for DbNexusAdapter and InklogModule.
# Requires at least one database backend feature (sqlite/postgres/mysql/duckdb).
kit = ["dep:trait-kit", "dbnexus/kit", "oxcache/kit"]
# Zstd compression support for rotated log files (optional to avoid zstd-sys
# symbol conflicts with downstream projects that bundle their own zstd).
compression = ["dep:zstd"]
# Parquet/Arrow export support for database sink archival.
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
# Aho-Corasick multi-pattern masking acceleration.
fast-masking = ["dep:aho-corasick"]

[dependencies]
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry", "env-filter"] }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
rayon = { version = "1.12", default-features = false }
futures = { version = "0.3", default-features = false, features = ["executor"] }
owo-colors = { version = "4.3", default-features = false, features = ["supports-colors"] }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
trait-kit = { version = "0.5.0-rc.2", path = "../trait-kit", default-features = false, features = ["async", "lifecycle", "health", "scope"], optional = true }
thiserror = { version = "2.0", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"], optional = true }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"], optional = true }
is-terminal = { version = "0.4", default-features = false }
bytes = { version = "1.12", default-features = false, features = ["std"] }
dirs = { version = "7.0", default-features = false }
parking_lot = { version = "0.12", default-features = false }
oxcache = { version = "0.5.0-rc.2", path = "../oxcache", default-features = false, features = ["macros", "memory", "serialization", "metrics", "batch"] }
zstd = { version = "0.14", default-features = false, optional = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
parquet = { version = "59.0", default-features = false, features = ["async", "arrow"], optional = true }
arrow-array = { version = "59.0", default-features = false, optional = true }
arrow-schema = { version = "59.0", default-features = false, optional = true }
dbnexus = { workspace = true, optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
clap = { version = "4.6", default-features = false, features = ["derive", "env", "std", "help", "usage", "error-context", "suggestions"], optional = true }
glob = { version = "0.3", default-features = false, optional = true }
ipnet = { version = "2.12", default-features = false, features = ["std"] }
subtle = { version = "2.6", default-features = false }
icu = { version = "2.3", default-features = false }
writeable = { version = "0.6", default-features = false }
fluent-bundle = { version = "0.16", default-features = false }
unic-langid = { version = "0.9", default-features = false }
intl-memoizer = { version = "0.5", default-features = false }
sys-locale = { version = "0.3", default-features = false }
aho-corasick = { version = "1.0", default-features = false, features = ["std", "perf-literal"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { version = "0.8", default-features = false, features = ["async_tokio"] }
serial_test = { version = "4.0", default-features = false }
axum = { version = "0.8", default-features = false }
log = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
filetime = { version = "0.2", default-features = false }
bytes = { version = "1.12", default-features = false, features = ["std"] }
assert_cmd = { version = "2.2", default-features = false }
predicates = { version = "3.1", default-features = false }
ctor = "1.0.13"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

# ============================================================================
# 测试目标显式注册（阶段 2 验收）
# ============================================================================
# tests/integration、tests/combinations、tests/performance 深目录聚合此前无
# 编译入口（Cargo 仅自动发现顶层 *.rs 与 */main.rs），从未被 cargo test
# 编译运行；此般注册复活。e2e_advanced 迁入 tests/e2e/ 目录承载
# （e2e_* 不得裸放顶层），迁移后必须显式注册。
[[test]]
name = "e2e_advanced"
path = "tests/e2e/e2e_advanced.rs"
# 19 个模块中仅 compression_e2e 有 #[cfg(feature = "compression")] 门，
# 其余用默认 feature API，无需 required-features，任意组合可编译运行

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
# 子目录 API 需求：DatabaseSink 用例（batch/verification/comprehensive/additional）
# 需 db 驱动；batch/verification/additional 经 MockDatabaseAdapter（DI）验证写入落库，
# 需 test-utils；http/ 子目录需 http；cli/ 用 inklog-cli 二进制需 cli；
# compression_ratio/ 需 compression；parquet/ 直用 arrow（仅 parquet feature
# 启用时对测试目标可见，dev-deps 无 arrow）
required-features = ["sqlite", "http", "cli", "compression", "parquet", "test-utils"]

[[test]]
name = "combinations"
path = "tests/combinations/mod.rs"
# complex_features/multi_sink_fallback 使用 DatabaseSink（db 后端需求）；
# 加密/掩码为默认 feature API
required-features = ["sqlite"]

[[test]]
name = "performance"
path = "tests/performance/mod.rs"
# 全部为默认 feature API；long_running_test 内 #[ignore = "manual"] 手动跑

[[bench]]
name = "inklog_bench"
harness = false

[[bin]]
name = "inklog-cli"
path = "src/cli/main.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
