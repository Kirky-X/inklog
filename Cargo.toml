[package]
name = "inklog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Enterprise-grade Rust logging infrastructure"

[workspace]
resolver = "2"
members = [".", "examples"]

[workspace.package]
version = "0.3.0-rc.11"
edition = "2024"
rust-version = "1.97.1"
authors = ["Kirky-X <Kirky-X@outlook.com>"]
license = "MIT"
repository = "https://github.com/Kirky-X/inklog"
homepage = "https://github.com/Kirky-X/inklog"
documentation = "https://docs.rs/inklog"
keywords = ["logging", "log", "structured-logging", "tracing", "observability"]
categories = ["development-tools::debugging"]

[workspace.dependencies]
# 工作区共享依赖，全部 default-features = false
async-trait = { version = "0.1", default-features = false }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net", "signal"] }
tracing = { version = "0.1", default-features = false }
anyhow = { version = "1.0", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
tempfile = { version = "3.27", default-features = false }
log = { version = "0.4", default-features = false, features = ["std"] }
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode"] }
# 掩码规则引擎：需要 lookahead/lookbehind 环视（regex crate 不支持），见 masking.rs
# dbnexus 跨仓地板：地板是已承诺兼容的最低版本，允许滞后；禁 `=` 精确钉（会迫使底层推进时顶层重发，并在下游产生双版本同图）
dbnexus = { version = "0.6.0-rc.11", default-features = false, features = ["sql-parser", "config-env", "macros", "permission", "observability", "retry", "failover", "replica-routing"] }
# docs.rs 不能用 all-features：四数据库后端（sqlite/postgres/mysql/duckdb）互斥（见 [features] 说明），全开必然编译失败
[package.metadata.docs.rs]
features = ["default", "http", "cli", "zstd", "gzip", "parquet", "fast-masking", "sqlite", "kit", "test-utils", "otlp", "net-sink", "kms", "dbnexus-audit", "confers-audit", "config-confers", "otel"]
rustdoc-args = ["--cfg", "docsrs"]

[workspace.lints.rust]
# feature 名由 cargo 自动注册进 check-cfg，无需手工枚举——手工清单一旦与真实 feature 集合漂移，反而会把合法 feature 误报成 unexpected
unexpected_cfgs = { level = "warn" }

[lints]
workspace = true

[features]
# i18n/cache 在 default 中；关闭两者时改用内嵌英文文案回退
default = ["i18n", "cache"]
# 国际化运行时：ICU4X 格式化 + fluent-bundle 翻译 + sys-locale 检测；关闭后 tr/tr_args 回退到内嵌 en 文案
i18n = ["dep:icu", "dep:writeable", "dep:fluent-bundle", "dep:unic-langid", "dep:sys-locale"]
# 缓存后端：裁 icu/fluent 依赖树必须同时关闭 i18n 与 cache，否则 ObjectPool 不导出
cache = ["dep:oxcache"]
# oxcache 审计事件 → inklog 结构化日志桥（实现 oxcache AuditEventPublisher 端口）
oxcache-audit = ["dep:oxcache"]
# mock 导出：不入 default 与生产组合，仅外部测试消费者显式启用
test-utils = []
# JSON Schema 导出（schemars）：cli 隐式启用（generate --schema）
schema = ["dep:schemars"]
# ⚠️ 数据库后端 features 互斥（embedded 与 server-side 不可混合，含 --all-features）
sqlite = ["dep:dbnexus", "dbnexus/sqlite", "dbnexus/runtime-tokio-rustls", "database"]
postgres = ["dep:dbnexus", "dbnexus/postgres", "dbnexus/runtime-tokio-rustls", "database"]
mysql = ["dep:dbnexus", "dbnexus/mysql", "dbnexus/runtime-tokio-rustls", "database"]
# DuckDB 数据库后端（通过 dbnexus 连接池）
duckdb = ["dep:dbnexus", "dbnexus/duckdb", "dbnexus/runtime-tokio-rustls", "database"]
# 内部聚合谓词：任一数据库后端启用时为真（cfg 收敛用），不引入驱动依赖
database = ["dep:dbnexus"]
http = ["dep:axum", "dep:axum-server"]
cli = ["dep:clap", "dep:glob", "schema"]
# trait-kit lifecycle/observability 集成（DbNexusAdapter/InklogModule）；需至少一个数据库后端 feature
kit = ["trait-kit/async", "trait-kit/lifecycle", "trait-kit/health", "trait-kit/scope", "trait-kit/observer", "dbnexus/kit", "oxcache/kit"]
# Zstd 压缩轮转日志（可选：避免与自带 zstd 的下游产生 zstd-sys 符号冲突）
zstd = ["dep:zstd"]
# 通用业务指标 registry（CounterVec/GaugeVec/HistogramVec + Prometheus 文本导出）
metrics-registry = []
# 兼容别名：等价于 `zstd`，保留既有 `--features compression` 用法
compression = ["zstd"]
# Gzip compression backend (optional, pure-Rust flate2).
gzip = ["dep:flate2"]
# Parquet/Arrow export support for database sink archival.
parquet = ["dep:parquet", "dep:arrow-array", "dep:arrow-schema"]
# Aho-Corasick multi-pattern masking acceleration.
# Deprecated no-op 别名：Aho-Corasick 加速自 rc.12 起随 trait-kit/masking 常载，
# 保留 feature 名为兼容（docs.rs 特性表与既有 --features 用法不受影响）
fast-masking = []
# Secret 出站脱敏：值形态正则 + 熵扫描 + 逐模式计数，超限 fail-closed
secret-scan = []
# dbnexus AuditStorage 端口适配器（审计事件 → DB sink 落库）；不含驱动，可与任一后端组合
dbnexus-audit = ["dep:dbnexus", "dbnexus/audit"]
# confers 配置集成：InklogConfig 经 confers 加载 + watch 热更新级别/轮转参数
config-confers = ["confers/toml", "confers/watch"]
# confers 审计桥——实现 confers AuditSink 端口（audit 事件 → inklog 结构化 sink 落盘）
confers-audit = ["confers/audit"]
# KMS 密钥提供者——confers AsyncKeyProvider 适配 + Vault transit MVP
kms = ["confers/encryption", "confers/cloud-kms"]
# 真 OpenTelemetry 链路上下文：从 span extensions 读取 SpanContext（宿主的 tracing-opentelemetry layer 写入）
otel = ["dep:opentelemetry"]
# 网络转发 Sink——TCP（可 TLS，rustls 客户端）+ UDP，断线缓冲重连
net-sink = ["dep:rustls"]
# 允许发布构建禁用 TLS 证书校验（danger_accept_invalid_certs）；默认关闭（跳过后只加密不认证，中间人可读取篡改外发日志且无信号）
insecure-tls = []
# OTLP 日志导出 MVP（OTLP/HTTP JSON，手写传输，无新增依赖）
otlp = []

[dependencies]
log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry", "env-filter"] }
crossbeam-channel = { workspace = true }
tokio = { workspace = true }
# supports-colors 不启用：inklog 经 is-terminal 检测 TTY，且该 feature 会同时拉入 supports-color 2 与 3
owo-colors = { version = "4.4", default-features = false }
regex = { workspace = true }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "1.2", default-features = false, features = ["derive", "std"], optional = true }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
# 掩码引擎宿主（trait-kit/masking）：inklog::DataMasker 等路径经 re-export 保持兼容
trait-kit = { version = "0.5.0-rc.12", default-features = false, features = ["masking"] }
confers = { version = "0.6.0-rc.12", default-features = false, features = ["toml", "watch"] }
thiserror = { version = "2.0", default-features = false }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"], optional = true }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"], optional = true }
is-terminal = { version = "0.4", default-features = false }
dirs = { version = "7.0", default-features = false }
parking_lot = { version = "0.13", default-features = false }
# oxcache 放宽为 caret：精确 pin 会与下游区间无交集导致解析冲突；rc.8/rc.10/rc.12 逐级实测兼容（inklog 消费面无变更），地板 rc.12 与 dbnexus rc.11 拉入版对齐避免双版本同图
oxcache = { version = "0.5.0-rc.12", default-features = false, features = ["memory", "serialization", "audit"], optional = true }
zstd = { version = "0.14", default-features = false, optional = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
parquet = { version = "60.0", default-features = false, features = ["async", "arrow"], optional = true }
arrow-array = { version = "60.0", default-features = false, optional = true }
arrow-schema = { version = "60.0", default-features = false, optional = true }
dbnexus = { workspace = true, optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
zeroize = { version = "1.9", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
clap = { version = "4.6", default-features = false, features = ["derive", "env", "std", "help", "usage", "error-context", "suggestions"], optional = true }
glob = { version = "0.3", default-features = false, optional = true }
ipnet = { version = "2.12", default-features = false, features = ["std"] }
subtle = { version = "2.6", default-features = false }
icu = { version = "2.3", default-features = false, features = ["compiled_data"], optional = true }
writeable = { version = "0.6", default-features = false, optional = true }
fluent-bundle = { version = "0.16", default-features = false, optional = true }
unic-langid = { version = "0.9", default-features = false, optional = true }
sys-locale = { version = "0.3", default-features = false, optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
criterion = { version = "0.8", default-features = false, features = ["async_tokio"] }
serial_test = { version = "4.0", default-features = false }
axum = { version = "0.8", default-features = false }
log = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
filetime = { version = "0.2", default-features = false }
bytes = { version = "1", default-features = false, features = ["std"] }
assert_cmd = { version = "2.2", default-features = false }
predicates = { version = "3.1", default-features = false }
# 仅测试/基准目标使用（src/ 零引用），不进入库消费者的依赖图
rayon = { version = "1.12", default-features = false }
futures = { version = "0.3", default-features = false, features = ["executor"] }
ctor = { version = "1.0.13", default-features = false, features = ["std", "proc_macro"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

# 测试目标显式注册：深目录之前无编译入口，从未被 cargo test 编译运行
[[test]]
name = "e2e_advanced"
path = "tests/e2e/e2e_advanced.rs"
# 仅 compression_e2e 有 feature 门，其余用默认 feature API，无需 required-features

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
# DatabaseSink 用例需 db 驱动；写入落库需 test-utils；http/ 需 http
required-features = ["sqlite", "http", "cli", "compression", "parquet", "test-utils"]

[[test]]
name = "combinations"
path = "tests/combinations/mod.rs"
# complex_features/multi_sink_fallback 使用 DatabaseSink（db 后端需求）
required-features = ["sqlite"]

[[test]]
name = "performance"
path = "tests/performance/mod.rs"
# 全部为默认 feature API；long_running_test 内 #[ignore = "manual"] 手动跑

[[bench]]
name = "inklog_bench"
harness = false

# rc4 轮新增/受影响路径基准（写入/序列化/加密），基线见 docs/PERFORMANCE.md
[[bench]]
name = "rc4_pipeline_bench"
harness = false

# secret-scan 出站门热路径基准，仅 secret-scan 下编译
[[bench]]
name = "secret_scan_bench"
harness = false
required-features = ["secret-scan"]

[[bin]]
name = "inklog-cli"
path = "src/cli/main.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"

