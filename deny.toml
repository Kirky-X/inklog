# cargo-deny 配置
[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# 忽略非关键的安全警告（这些是 transitive 依赖的问题）
ignore = [
    "RUSTSEC-2026-0235", # rkyv 0.7.46 — transitive dep via duckdb → rust_decimal → rkyv，无法升级
    "RUSTSEC-2024-0436", # paste — unmaintained，transitive dep
    "RUSTSEC-2026-0173", # proc-macro-error2 — unmaintained，transitive dep
    "RUSTSEC-2026-0221", # event-listener — unsound，transitive dep
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Zlib",        # for foldhash (hashbrown dependency)
    "CC0-1.0",     # for tiny-keccak (arrow/parquet transitive dependency)
    "Unicode-3.0", # for icu* crates (url/reqwest dependency)
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
