[package]
name = "inklog-examples"
version = "0.1.12"
edition = "2021"
publish = false
description = "Examples for inklog - Enterprise-grade Rust logging infrastructure"

[features]
sqlite = ["inklog/sqlite", "dep:dbnexus", "dbnexus/sqlite"]
postgres = ["inklog/postgres", "dep:dbnexus", "dbnexus/postgres"]
mysql = ["inklog/mysql", "dep:dbnexus", "dbnexus/mysql"]
duckdb = ["inklog/duckdb", "dep:dbnexus", "dbnexus/duckdb"]
compression = ["inklog/compression"]
parquet = ["inklog/parquet"]

[dependencies]
inklog = { path = ".." }
async-trait = { workspace = true }
dbnexus = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1.20", default-features = false, features = ["v4"] }
chrono = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
# Layer 0 示例所需：log crate 适配器、channel、自定义正则模式
log = { workspace = true }
crossbeam-channel = { workspace = true }
regex = { workspace = true }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }

[[bin]]
name = "console"
path = "src/bin/sinks/console.rs"

[[bin]]
name = "file"
path = "src/bin/sinks/file.rs"

[[bin]]
name = "encryption"
path = "src/bin/security/encryption.rs"

[[bin]]
name = "performance"
path = "src/bin/infra/performance.rs"

[[bin]]
name = "database"
path = "src/bin/database/database.rs"

[[bin]]
name = "http"
path = "src/bin/network/http.rs"

[[bin]]
name = "fallback"
path = "src/bin/infra/fallback.rs"

# 现有 binary（保留）
[[bin]]
name = "basic"
path = "src/bin/core/basic.rs"

[[bin]]
name = "production"
path = "src/bin/core/production.rs"

[[bin]]
name = "all_features"
