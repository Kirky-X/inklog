[package]
name = "inklog-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Examples for inklog - Enterprise-grade Rust logging infrastructure"

[lints]
workspace = true

[features]
sqlite = ["inklog/sqlite", "dep:dbnexus", "dbnexus/sqlite"]
postgres = ["inklog/postgres", "dep:dbnexus", "dbnexus/postgres"]
mysql = ["inklog/mysql", "dep:dbnexus", "dbnexus/mysql"]
duckdb = ["inklog/duckdb", "dep:dbnexus", "dbnexus/duckdb"]
http = ["inklog/http"]
cli = ["inklog/cli"]
compression = ["inklog/compression", "inklog/gzip"]
parquet = ["inklog/parquet"]
confers-audit = ["inklog/confers-audit", "dep:confers"]

[dependencies]
inklog = { path = "..", version = "0.3.0-rc.7", features = ["test-utils"] }
async-trait = { workspace = true }
dbnexus = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
# serde 必须声明为直接依赖：`#[derive(Serialize)]` 展开时 serde_derive 生成
# `extern crate serde as _serde;`，该路径在展开期解析的是**本 crate 自身的
# extern prelude**，无法经 `inklog::serde` 再导出别名满足（同 src/lib.rs
# “Re-export underlying dependencies” 一节对 L2/L3 宏路径的说明）。
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1.26", default-features = false, features = ["v4"] }
chrono = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
# Layer 0 示例所需：log crate 适配器、channel、自定义正则模式
log = { workspace = true }
crossbeam-channel = { workspace = true }
regex = { workspace = true }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
# confers 审计桥示例所需（与 inklog 同钉已发布 rc.6；仅 audit feature）
confers = { version = "0.6.0-rc.6", default-features = false, features = ["audit"], optional = true }

[[bin]]
name = "console"
path = "src/bin/sinks/console.rs"

[[bin]]
name = "file"
path = "src/bin/sinks/file.rs"

[[bin]]
name = "encryption"
path = "src/bin/security/encryption.rs"

[[bin]]
name = "performance"
path = "src/bin/infra/performance.rs"

[[bin]]
name = "database"
