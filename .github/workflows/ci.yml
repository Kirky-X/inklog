# CI 质量门禁:fmt / clippy / check / test / cross-platform / doc / security / coverage(≥95%) / benchmark(手动开关+宽松天花板)
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_bench:
        description: "Run benchmark job (criterion fast profile + loose ceiling)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run clippy
        # test-utils 必须加入：integration 测试目标 required-features 含它，
        # 缺失时该目标被 cargo 静默跳过，clippy 门禁将不覆盖集成测试代码
        run: cargo clippy --workspace --all-targets --features "sqlite http cli kit compression gzip parquet fast-masking test-utils" -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    # 零特性测试步要编译约 47 个测试目标（Test job 同口径约 11 分钟），
    # 冷缓存下 20 分钟余量不足；与 Test job 的 30 分钟对齐。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Check all features
        run: cargo check --workspace --features "sqlite http cli kit compression gzip parquet fast-masking"
      # 裸 schema 组合是 README 文档化的独立公共面（不经 cli 隐式启用），
      # 防止 schema 门控代码误引用 cli 门控符号时门禁全绿
      - name: Check bare schema feature
        run: cargo check --workspace --features schema
      # 零特性组合的测试目标：cargo check 不编译 test 目标，零特性下测试代码的
      # 编译裂缝与行为回归此前无覆盖（三条 OS 腿的 Build (zero features) 只 check）。
      # 实测 --no-default-features 全量测试绿色（含 lib/集成/组合各目标）。
      - name: Test zero features
        run: cargo test --workspace --no-default-features

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run tests
        # test-utils 必须加入：integration 测试目标 required-features 含它，
        # 缺失时 cargo 静默跳过该目标（不报错、不执行），测试门禁形同虚设
        run: cargo test --workspace --features "sqlite http cli kit compression gzip parquet fast-masking test-utils"

      - name: Verify config schema artifact has no drift
        run: |
          # 先断言产物已入库：git diff 不含 untracked，漏 add 时该步骤会静默空转
          git ls-files --error-unmatch config_schema.json
          # feature 集与上方测试步骤一致以复用编译产物（cli 隐含 schema）；
          # 单测为 trim_end 比较，此处 git diff 兜底字节级差异（含尾随换行）
          cargo run --quiet --features "sqlite http cli kit compression gzip parquet fast-masking test-utils" --bin inklog-cli -- generate --schema --output config_schema.json
          git diff --exit-code -- config_schema.json

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y
      - name: Build
        run: cargo build --workspace --features "sqlite http cli kit compression gzip parquet fast-masking"
      # 零特性组合：平台相关分支（cfg(not(unix))）里的符号引用只有在此组合下才暴露，
      # 三条 OS 腿都要跑（历史上 inklog 曾在非 unix 分支引用 feature 门控导入的 File 而 E0433）。
      - name: Build (zero features)
        run: cargo check --workspace --no-default-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build documentation
        run: cargo doc --workspace --no-deps --features "sqlite http cli kit compression gzip parquet fast-masking"
        env:
          RUSTDOCFLAGS: -D warnings

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install tools
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage (gate ≥95% lines)
        # Use `--lib` instead of `--workspace` to avoid linker resource exhaustion
        # 门禁分阶段抬升（80→85→90→95，R-inklog-007）；85/90 两级无独立提交与
        # 实测留痕，终值 95 实测 95.40%、留 0.4pp 余量。
        # zstd 用主名而非 compression 别名（对齐 R-inklog-008 命名契约）。
        run: cargo llvm-cov --features "sqlite http cli kit zstd gzip parquet fast-masking" --lib --fail-under-lines 95 --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  # 基准测量对共享 runner 噪声敏感：不进 push/PR 常规门禁，仅 workflow_dispatch
  # 勾选 run_bench 时运行（显式开关）。阈值取宽松天花板（≈16x 本地基线），只拦
  # 灾难性回退（如热路径误接阻塞 I/O）；精确回归对照以 docs/PERFORMANCE.md
  # 基线为人工载体，待固定 runner 后再收紧。
  benchmark:
    name: Benchmark (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && inputs.run_bench
    # 独立 concurrency 组且不取消：job 级覆盖 workflow 级配置，避免手动
    # bench run 被同分支 push 的 cancel-in-progress 组连带取消
    concurrency:
      group: benchmark-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Run rc4_pipeline_bench (fast profile)
        run: cargo bench --bench rc4_pipeline_bench -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Run inklog_bench (fast profile)
        run: cargo bench --bench inklog_bench -- --warm-up-time 1 --measurement-time 3 --sample-size 10
      - name: Loose ceiling guard (write_path/template_render_text)
        # 天花板 5 µs：本地基线 ≈0.31 µs（docs/PERFORMANCE.md），共享 runner
        # 放宽到 ~16x；只拦灾难性回退，正常噪声不误报
        run: |
          est=target/criterion/write_path/template_render_text/new/estimates.json
          test -f "$est" || { echo "missing criterion estimates: $est"; exit 1; }
          median_ns=$(python3 -c "import json,sys;print(int(json.load(open(sys.argv[1]))['median']['point_estimate']))" "$est")
          ceiling_ns=5000
          echo "template_render_text median = ${median_ns} ns (ceiling ${ceiling_ns} ns)"
          if [ "$median_ns" -gt "$ceiling_ns" ]; then
            echo "REGRESSION: median ${median_ns} ns exceeds loose ceiling ${ceiling_ns} ns"
            exit 1
          fi
      - name: Upload criterion reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: criterion-reports
          path: target/criterion
          retention-days: 14
          if-no-files-found: warn
