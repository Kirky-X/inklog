name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release 只带 GitHub 自动生成的源码压缩包,不构建/附带二进制产物。
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  publish-crates:
    name: Publish to crates.io
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5 # 1.97.1

      - name: Resolve version
        id: ver
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="inklog") | .version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check already published
        id: published
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://crates.io/api/v1/crates/inklog/${{ steps.ver.outputs.version }})
          echo "crates.io: inklog=$CODE for ${{ steps.ver.outputs.version }}"
          echo "exists=$([[ "$CODE" == "200" ]] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        run: |
          sleep 5
          cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # 本地/重跑路径已发布时撞车属幂等成功，不阻断 Release 交付
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # publish 带幂等 continue-on-error,但版本最终必须可查——
      # 否则此处硬失败,防止"绿色 Release 实际没发出去"的静默漏发。
      - name: Verify on crates.io
        if: always()
        run: |
          ok=""
          for i in 1 2 3 4 5; do
            sleep 20
            # crates.io API 必须带 User-Agent,否则 403
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -H 'User-Agent: kirky-x-release-verify' \
              "https://crates.io/api/v1/crates/inklog/${{ steps.ver.outputs.version }}")
            echo "try$i: HTTP ${CODE}"
            if [ "$CODE" = "200" ]; then ok=1; break; fi
            if [ "$CODE" != "403" ]; then break; fi
          done
          if [ -z "$ok" ]; then
            echo "::error::inklog ${{ steps.ver.outputs.version }} 未出现在 crates.io(HTTP ${CODE})"
            exit 1
          fi
