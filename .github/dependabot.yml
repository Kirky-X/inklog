# Dependabot 依赖更新（GitHub 原生）。
version: 2
updates:
  # GitHub Actions 版本自动更新
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]

  # Rust Cargo 依赖自动更新
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
