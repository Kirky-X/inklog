# gitleaks 配置 —— 安全扫描误报降噪（非关闭检测）
# 用法：gitleaks detect --source . --config .gitleaks.toml
# 说明：inklog 此前仅依赖内置默认规则 + 自维护 .gitleaksignore（无 toml），但内置默认
# allowlist 不覆盖 .secrets.baseline / reviews/ 等“检测器产物”，且 useDefault 继承的是
# 规则而非默认 allowlist，导致全历史扫描把大量基线自报/历史扫描产物/示例文档判为命中。
# 此处显式枚举“永不存放真实凭据”的目录级噪声路径（与 NexusFlow 放行 .secrets.baseline
# 的既有做法一致）；生产 src 内联测试夹具的零星命中仍由既有 .gitleaksignore 逐行指纹处理。

title = "Inklog gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "目录级噪声放行：基线自报/vendored/扫描产物/测试/示例/基准/文档/testdata/fixtures/构建产物"
paths = [
    '''(^|/)\.secrets\.baseline$''',
    '''(^|/)\.cargo/registry/''',
    '''(^|/)reviews/''',
    '''(^|/)tests?/''',
    '''(^|/)examples?/''',
    '''(^|/)benches?/''',
    '''(^|/)docs?/''',
    '''(^|/)testdata/''',
    '''(^|/)fixtures?/''',
    '''_tests?\.rs$''',
    '''\.md$''',
    '''(^|/)target/''',
]
