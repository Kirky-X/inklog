# lefthook 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# 启用: lefthook install(或 bash scripts/install-pre-commit.sh)
# 与 .pre-commit-config.yaml 功能等价,二选一即可。
pre-commit:
  parallel: true
  commands:
    rustfmt-check:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      # 零告警门槛 feature 组合(与 CI clippy job 一致);db 驱动互斥,不可用 --all-features
      run: cargo clippy --all-targets --no-default-features --features sqlite,http,cli,kit,compression,parquet,fast-masking -- -D warnings
    cargo-deny:
      run: cargo deny check
    no-private-key:
      run: "! git diff --cached --name-only | xargs -r grep -IlE 'BEGIN (RSA|OPENSSH|PGP|EC|PRIVATE) PRIVATE KEY|sk-[A-Za-z0-9]{20,}'"

commit-msg:
  commands:
    conventional:
      run: 'grep -qE "^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert|style)(\(.+\))?!?: .+" {1}'

pre-push:
  commands:
    cargo-audit:
      run: cargo audit
    coverage-95:
      name: coverage ≥95% lines
      # 与 CI coverage job 同口径（显式 features + --lib）。裸 default 跑不通：
      # tests/cli_integration.rs 经 #![cfg(feature = "cli")] 整体禁用后是空
      # target——能构建、跑 0 tests，但不产出任何覆盖率数据，llvm-cov report
      # 阶段以 "no coverage data found" 崩溃，门禁必红。
      run: cargo llvm-cov --features "sqlite http cli kit zstd gzip parquet fast-masking" --lib --fail-under-lines 95
