# pre-commit 配置 — 7 仓库统一基线(见 base/CONFIG_BASELINE.md)
# 安装: pip install pre-commit && pre-commit install --install-hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key
        # 假密钥测试夹具白名单(精确到文件，钩子对其余全部文件仍然生效)：
        #   src/domain/config/config.rs、src/domain/config/http.rs —
        #     仅写入裸 PEM 头(无 key body)作为「路径存在性」校验夹具，
        #     断言只比对路径名，内容非真实密钥；
        #   tests/unit/masking_test.rs — 脱敏规则 ***REDACTED_PRIVATE_KEY***
        #     的断言输入，key body 为占位省略号 "MIIBogIBAAJ..."。
        # detect-private-key 只做字节级子串匹配、无 inline allowlist 机制，
        # 故只能在此按文件排除；args 未放宽，其余文件仍全量检测
        # (已用新增假密钥探针验证：probe 文件会被拦下)。
        exclude: '^(src/domain/config/config\.rs|src/domain/config/http\.rs|tests/unit/masking_test\.rs)$'
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: no-commit-to-branch
        # 本仓工作流在 main 上提交，故仅保护 master
        args: ['--branch', 'master']

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # --baseline: .secrets.baseline 记录已人工核实的误报(测试夹具凭证、
        # 文档示例、locale 文案、commit 短哈希等)；带 --baseline 时基线内
        # 发现放行，基线外的新发现仍阻断。
        args: [--baseline, .secrets.baseline, --exclude-files, tests/, --exclude-files, examples/]
        # 自排除: 基线文件本身(内含凭证哈希)与锁文件不参与扫描
        exclude: '^(Cargo\.lock|\.secrets\.baseline)$'

  - repo: https://github.com/crate-ci/typos
    rev: v1.28.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Format Rust code
        description: Run rustfmt on Rust files
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --no-default-features --features sqlite,http,cli,kit,compression,parquet,fast-masking
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --no-default-features --features sqlite,http,cli,kit,compression,parquet,fast-masking -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  # === 提交完成后清理本地编译产物（post-commit 阶段；启用: pre-commit install -t post-commit） ===
  - repo: local
    hooks:
      - id: post-commit-clean
        name: clean local build artifacts (cargo target + python)
        entry: >-
          bash -c 'cargo clean >/dev/null 2>&1;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d -name target -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name .hypothesis -o -name "*.egg-info" \) -prune -exec rm -rf {} +;
          find . \( -name node_modules -o -name .venv \) -prune -o -type f \( -name "*.pyc" -o -name "*.pyo" \) -exec rm -f {} +;
          if [ -z "$(git ls-files build dist)" ]; then rm -rf build dist; fi;
          echo "[post-commit] 已清理 cargo target 与 Python 编译产物"'
        language: system
        always_run: true
        pass_filenames: false
        stages: [post-commit]
ci:
  autoupdate_commit_msg: "chore: update pre-commit hooks"

# 全局阶段约束
default_stages: [pre-commit]  # 锁定未显式声明 stages 的 hook，避免污染 post-commit 等阶段
